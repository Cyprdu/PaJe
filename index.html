<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MonCamp - Plein écran</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        #viewer {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<iframe id="viewer" src="https://moncamp.fr/PAJE"></iframe>

<script>
    const iframe = document.getElementById("viewer");

    // Intercepte les tentatives d’ouverture en nouvel onglet pour les forcer dans l’iframe
    window.addEventListener("message", (event) => {
        // Sécurité : n’acceptez que les messages venant du domaine voulu
        if (!event.origin.includes("moncamp.fr")) return;

        if (event.data?.type === "openInSameFrame") {
            iframe.src = event.data.url;
        }
    });

    // Script pour injecter un override dans les pages chargées (si autorisé)
    iframe.onload = () => {
        try {
            const doc = iframe.contentDocument;

            // Convertit tous les liens _blank en navigation interne
            const links = doc.querySelectorAll("a[target='_blank']");
            links.forEach(link => {
                link.addEventListener("click", (e) => {
                    e.preventDefault();
                    iframe.src = link.href;
                });
            });

        } catch (e) {
            // Si le site empêche l’accès (protection cross-origin), on ignore
            console.warn("Impossible de modifier les liens : restrictions CORS/X-Frame.");
        }
    };
</script>

</body>
</html>
